name: Publish release artifacts

# Builds the container image, pushes it to GitHub Container Registry, then
# publishes the matching metadata to the official MCP Registry.
#
# Both steps authenticate with the repository's own GitHub identity:
#   - GHCR uses the automatically provided GITHUB_TOKEN
#   - the MCP Registry uses GitHub OIDC (id-token: write), which proves that the
#     job runs in yanglinfeng's repository and therefore owns the
#     io.github.yanglinfeng/* namespace
# No npm account, no PAT, and no long-lived secret is involved.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build from. Leave empty to build from the current default branch."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push container image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Derive release version
        id: release
        # The version comes from server.json, which is also what the MCP Registry
        # reads. Deriving it from the git ref instead would let the image tag and
        # the published metadata drift apart.
        run: |
          VERSION="$(jq -r '.version' server.json)"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "server.json has no version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # arm64 matters: most developers running this locally are on Apple
          # Silicon, and an amd64-only image would fall back to slow emulation.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  registry:
    name: Publish metadata to the MCP Registry
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
